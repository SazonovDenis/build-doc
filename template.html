<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 14px; color: #222; background: #fff; }
a { color: #2688d4; text-decoration: none; }
a:hover { text-decoration: underline; }

$layout-css()$

main { line-height: 1.5; }
h1 { font-size: 22px; margin-bottom: 12px; }
h2 { font-size: 19px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #2688d4; color: #1a5fa0; }
h3 { font-size: 16px; margin: 22px 0 6px; color: #1a5fa0; }
h4, h5, h6 { font-size: 14px; margin: 14px 0 4px; color: #444; }
p { margin: 6px 0; }
ul, ol { margin: 6px 0 6px 24px; }
li { margin: 2px 0; }
code { font-family: Consolas, monospace; font-size: 13px; background: #f3f5f9; padding: 0 3px; border-radius: 3px; }
pre { background: #f3f5f9; padding: 8px 12px; overflow-x: auto; margin: 8px 0; }
pre code { padding: 0; }
blockquote { border-left: 3px solid #c5d5ee; padding-left: 12px; color: #555; margin: 8px 0; }

/* Таблицы - как в db.html */
main table { display: block; overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; margin: 8px 0 12px; font: inherit; }
th { background: #e8f0fb; color: #1a5fa0; text-align: left; padding: 6px 10px; border: 1px solid #c5d5ee; font-weight: normal; }
td { padding: 2px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: #f7f9fe; }

/* Справочники */
.dict-used { color: #888; font-size: 12px; }

</style>
</head>
<body>
<nav class="pages">$nav$</nav>
<div class="layout">
$if(toc)$
<nav class="toc">
$toc$
</nav>
$endif$
<main>
$body$
</main>
</div>
</body>
</html>
